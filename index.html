<!DOCTYPE html>
<html lang="en">
<head>
    <title>YingLak</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/index.css">
    <style>
        body { text-align: center; font-family: sans-serif; background-color: #f5f5f5; }
        #login-btn { padding: 10px 20px; font-size: 18px; cursor: pointer; border: none; border-radius: 8px; background: #4267B2; color: white; }
        #game-container { display: none; }
    </style>
</head>
<body>
    <h1>ยินดีต้อนรับสู่ YingLak</h1>
    <button id="login-btn">เข้าสู่ระบบด้วย Facebook</button>

    <div id="game-container">
        <!-- Your Game -->
        <canvas id="gameCanvas"></canvas>
        <!-- Game libraries -->
        <script src="js/lib/three.js"></script>
        <script src="js/lib/OrbitControls.js"></script>
        <script src="js/lib/dat.gui.min.js"></script>
        <script src="js/lib/GLTFLoader.js"></script>
        <script src="js/lib/physi.js"></script>
        <script src="js/lib/WebGL.js"></script>
        <!-- Game logic -->
        <script src="js/GoalDoor.js"></script>
        <script src="js/main.js"></script>
    </div>

    <!-- Facebook SDK -->
    <div id="fb-root"></div>
    <script async defer crossorigin="anonymous"
        src="https://connect.facebook.net/en_US/sdk.js"></script>

    <script>
        window.fbAsyncInit = function() {
            FB.init({
                appId: '1890525061049319', // เปลี่ยนเป็น App ID ของคุณ
                cookie: true,
                xfbml: true,
                version: 'v19.0'
            });

            // ตรวจสอบสถานะเมื่อโหลดหน้า
            FB.getLoginStatus(function(response) {
                if (response.status === 'connected') {
                    startGameWithFacebook();
                }
            });
        };

        document.getElementById('login-btn').addEventListener('click', function () {
            FB.login(function(response) {
                if (response.authResponse) {
                    console.log('✅ Login สำเร็จ');
                    startGameWithFacebook();
                } else {
                    alert('❌ การเข้าสู่ระบบล้มเหลว');
                }
            }, {scope: 'public_profile'});
        });

        function startGameWithFacebook() {
            document.getElementById('login-btn').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            FB.AppEvents.logEvent('game_started');
            console.log("🎮 Game Started");

            // เรียก startGame() ถ้าใน main.js มีฟังก์ชันนั้น
            if (typeof startGame === 'function') {
                startGame();
            }
        }
    </script>
</body>
</html>
